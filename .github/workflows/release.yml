name: Release

# Publish a release on GitHub with a tag like v5.1.0. This workflow then runs the tests,
# builds ModFerry-5.1.0.zip with that version and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  package:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the ZIP to the release
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release version like v5.1.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build ZIP
        run: python tools/make_release.py --version "${TAG#v}"

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ModFerry-*.zip --clobber --repo "$GITHUB_REPOSITORY"
