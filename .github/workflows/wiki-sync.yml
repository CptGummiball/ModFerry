name: Wiki sync

# Copies the pages from wiki/ into the GitHub wiki whenever they change on main.
# The wiki/ folder is the source: edit pages there (or via pull request), not in the wiki UI,
# because pages that only exist in the wiki are removed on the next sync.
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push pages to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
