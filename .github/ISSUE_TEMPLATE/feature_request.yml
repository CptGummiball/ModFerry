name: ✨ Feature request
description: Suggest an idea for ModFerry
labels: [enhancement, triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and discussions.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Which problem would this solve?
      description: Describe your workflow and where ModFerry gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Screenshots or mockups are welcome.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affects
      multiple: true
      options: [CurseForge, Modrinth, Both, UI only]
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md).
